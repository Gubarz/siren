name: Release

# Dormant by design: this workflow only runs when a v* tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wails v3 default: GTK4 + webkitgtk-6.0
          - name: linux-amd64-gtk4
            os: ubuntu-24.04
            output: dist/siren
            asset: siren-linux-amd64-gtk4.tar.gz
            build_tags: ""
            linux_deps: libgtk-4-dev libwebkitgtk-6.0-dev
            gui_ldflags: ""
            cgo: "1"
          # Wails v3 opt-in: GTK3 + webkit2gtk-4.1 (older distros)
          - name: linux-amd64-gtk3-webkit4.1
            os: ubuntu-24.04
            output: dist/siren
            asset: siren-linux-amd64-gtk3-webkit4.1.tar.gz
            build_tags: "gtk3"
            linux_deps: libgtk-3-dev libwebkit2gtk-4.1-dev
            gui_ldflags: ""
            cgo: "1"
          - name: windows-amd64
            os: windows-latest
            output: dist/siren.exe
            asset: siren-windows-amd64.zip
            build_tags: ""
            linux_deps: ""
            gui_ldflags: "-H windowsgui"
            cgo: "0"
          - name: macos-arm64
            os: macos-latest
            output: dist/siren
            asset: siren-macos-arm64.tar.gz
            build_tags: ""
            linux_deps: ""
            gui_ldflags: ""
            cgo: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are required for version stamping

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview headers
        if: matrix.linux_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linux_deps }}

      # frontend/dist is embedded via go:embed, so it must exist first.
      # frontend/bindings is gitignored — bindings must be generated from
      # the Go service before vite can build the frontend.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7

      - name: Generate Wails bindings
        run: wails3 generate bindings

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          COMMIT=$(git rev-parse --short=12 HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p "$(dirname "${{ matrix.output }}")"
          go build \
            -tags "production ${{ matrix.build_tags }}" \
            -trimpath \
            -buildvcs=false \
            -ldflags="-w -s ${{ matrix.gui_ldflags }} -X siren/internal/buildinfo.Version=${GITHUB_REF_NAME} -X siren/internal/buildinfo.Commit=${COMMIT} -X siren/internal/buildinfo.Date=${DATE}" \
            -o "${{ matrix.output }}" \
            .

      - name: Package archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts pkg
          cp "${{ matrix.output }}" LICENSE README.md pkg/
          tar -czf "artifacts/${{ matrix.asset }}" -C pkg .

      - name: Package archive (zip)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force artifacts, pkg | Out-Null
          Copy-Item "${{ matrix.output }}", LICENSE, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "artifacts/${{ matrix.asset }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # The 0.x line ships as prerelease; flip to false at 1.0.
          prerelease: true
          body: |
            **Notes**
            - macOS builds are unsigned: right-click → Open, or run `xattr -d com.apple.quarantine` on the binary.
