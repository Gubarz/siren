name: Release

# Dormant by design: this workflow only runs when a v* tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wails v3 default: GTK4 + webkitgtk-6.0
          - name: linux-amd64-gtk4
            os: ubuntu-24.04
            output: dist/siren
            asset: siren-linux-amd64-gtk4.tar.gz
            build_tags: ""
            linux_deps: libgtk-4-dev libwebkitgtk-6.0-dev
            cgo: "1"
          # Wails v3 opt-in: GTK3 + webkit2gtk-4.1 (older distros)
          - name: linux-amd64-gtk3-webkit4.1
            os: ubuntu-24.04
            output: dist/siren
            asset: siren-linux-amd64-gtk3-webkit4.1.tar.gz
            build_tags: "gtk3"
            linux_deps: libgtk-3-dev libwebkit2gtk-4.1-dev
            cgo: "1"
          # Windows ships as a console-subsystem binary (no -H windowsgui):
          # the --sliver-console subprocess must attach to a ConPTY, which
          # only works for console-subsystem children. The GUI hides its
          # own console window at startup (cmd/gui/hideconsole_windows.go).
          # Cross-compiled on a Linux runner: the wails v3 Windows stack is
          # pure Go (cgo "0"), so no Windows runner is needed. GTK headers
          # are still required because the wails3 CLI is built for the
          # runner's own OS.
          - name: windows-amd64
            os: ubuntu-24.04
            goos: windows
            goarch: amd64
            output: dist/siren.exe
            asset: siren-windows-amd64.zip
            build_tags: ""
            linux_deps: libgtk-4-dev libwebkitgtk-6.0-dev zip
            cgo: "0"
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            output: dist/siren
            asset: siren-macos-arm64.tar.gz
            build_tags: ""
            linux_deps: ""
            cgo: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are required for version stamping

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview headers
        if: matrix.linux_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linux_deps }}

      # frontend/dist is embedded via go:embed, so it must exist first.
      # frontend/bindings is gitignored — bindings must be generated from
      # the Go service before vite can build the frontend.
      # The CLI links Wails' Linux windowing stack, so it must be built
      # with the same toolkit tag as the app: the gtk3 job only installs
      # GTK3/webkit2gtk-4.1 headers and the CLI would otherwise fail to
      # link against GTK4/webkitgtk-6.0.
      - name: Install Wails CLI
        shell: bash
        run: go install -tags "${{ matrix.build_tags }}" github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Generate Wails bindings
        run: wails3 generate bindings

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          COMMIT=$(git rev-parse --short=12 HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p "$(dirname "${{ matrix.output }}")"
          go build \
            -tags "production ${{ matrix.build_tags }}" \
            -trimpath \
            -buildvcs=false \
            -ldflags="-w -s -X siren/internal/buildinfo.Version=${GITHUB_REF_NAME} -X siren/internal/buildinfo.Commit=${COMMIT} -X siren/internal/buildinfo.Date=${DATE}" \
            -o "${{ matrix.output }}" \
            .

      - name: Package archive (tar.gz)
        if: endsWith(matrix.asset, '.tar.gz')
        shell: bash
        run: |
          mkdir -p artifacts pkg
          cp "${{ matrix.output }}" LICENSE README.md pkg/
          tar -czf "artifacts/${{ matrix.asset }}" -C pkg .

      - name: Package archive (zip)
        if: endsWith(matrix.asset, '.zip')
        shell: bash
        run: |
          mkdir -p artifacts pkg
          cp "${{ matrix.output }}" LICENSE README.md pkg/
          (cd pkg && zip -qr "../artifacts/${{ matrix.asset }}" .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # The 0.x line ships as prerelease; flip to false at 1.0.
          prerelease: true
          body: |
            **Notes**
            - macOS builds are unsigned: right-click → Open, or run `xattr -d com.apple.quarantine` on the binary.
