name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # Wails links against WebKitGTK on Linux. ubuntu-22.04 ships 4.0,
      # which is what the default (untagged) build expects.
      - name: Install WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/tools/cmd/deadcode@v0.48.0
          go install github.com/mibk/dupl@v1.1.0

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet .

      - name: staticcheck
        run: staticcheck .

      - name: deadcode
        run: deadcode -test .

      - name: dupl
        run: dupl -t 50 *.go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m ./...

      - name: Go file length check
        run: ./scripts/check-go-file-length.sh

  frontend:
    name: Frontend analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run analyze
      - run: npm --prefix frontend run build

  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded via go:embed, so it must exist first.
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      # Building every package and discarding the binaries is a
      # cross-platform compile check. Linux is covered by the Go job.
      - name: go build (compile check)
        run: go build ./...
