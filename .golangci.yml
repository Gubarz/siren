version: "2"

# See CONTRIBUTING.md for the 350-line file / 45-line function budget.
# funlen enforces the per-function line cap. File length has no built-in
# linter — see scripts/check-go-file-length.sh (wired into `make analyze-go`).

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - funlen
    - govet
    - ineffassign
    - staticcheck
  settings:
    funlen:
      lines: 45
      statements: -1
      ignore-comments: true
  exclusions:
    paths:
      - node_modules
      - frontend
      - build
      - dist
      - scripts
    rules:
      - path: _test\.go$
        linters:
          - errcheck
      - path: ^app\.go$
        linters:
          - funlen
      - path: ^cmd/gui/app\.go$
        linters:
          - funlen
      - path: ^vendor/
        linters:
          - errcheck

issues:
  max: 0
  max-per-issue: 0
  uniq-by-line: true
